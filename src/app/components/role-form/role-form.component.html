<div class="rounded-md mt-5 p-5">
  <form (submit)="add()">
    <mat-form-field class="w-full">
      <mat-label>Role Name</mat-label>
      <input
        type="text"
        name="roleName"
        matInput
        [(ngModel)]="role.roleName"
        placeholder="Role Name"
        required
      />
      @if (!role.roleName) {
        <mat-error class="text-base"> Role Name is required </mat-error>
      }
    </mat-form-field>
    @if (errorMessage) {
      <span class="text-base text-red-500">{{ errorMessage }}</span>
    }
    <button
      type="submit"
      class="bg-purple-600 px-4 disabled:bg-purple-400 rounded-md text-white py-2 m-2"
      [disabled]="!role.roleName"
    >
      Add
    </button>
  </form>
</div>
