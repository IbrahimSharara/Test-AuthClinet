<div class="h-screen flex items-center justify-center">
  <form
    (ngSubmit)="login()"
    [formGroup]="form"
    action=""
    class="shadow-md rounded-md p-5 bg-white w-2/6"
  >
    <div class="py-4">
      <h1 class="font-bold py-2">Login</h1>
    </div>
    <mat-form-field appearance="fill" class="w-full">
      <mat-label>Email</mat-label>
      <input
        matInput
        type="text"
        placeholder="Email"
        name="email"
        formControlName="email"
      />
      <mat-icon matPrefix>email</mat-icon>
    </mat-form-field>
    <mat-form-field appearance="fill" class="w-full">
      <mat-label>Password</mat-label>
      <input
        type="{{ hidden ? 'password' : 'text' }}"
        matInput
        name="password"
        formControlName="password"
        placeholder="Password"
      />
      <mat-icon matPrefix>lock</mat-icon>
      <mat-icon (click)="hidden = !hidden" matSuffix>{{
        hidden ? "visibility_off" : "visibility"
      }}</mat-icon>
    </mat-form-field>
    <button
      [disabled]="!form.valid"
      class="w-full bg-purple-700 p-3 text-white border border-slate-200 rounded-md"
    >
      Login
    </button>
    <div class="my-5">
      <span class="text-slate-600"> Dont Have Account ?! </span>
      <a class="text-purple-500" routerLink="/register">Register</a>
    </div>
  </form>
</div>
