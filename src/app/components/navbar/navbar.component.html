<div>
  <mat-toolbar color="primary">
    <button mat-icon-button>
      <mat-icon>menu</mat-icon>
    </button>
    <a routerLink="/">My Application</a>
    <div class="w-full"></div>
    @if (isLoggedIn()) {
      <div>
        <div class="flex gap-5 items-center">
          <a
            [matMenuTriggerFor]="menu"
            class="flex gap2 cursor-pointer items-center"
          >
            <div
              class="bg-red-500 text-white font-bold shadow-md rounded-full w-5 h-5 flex justify-center items-center"
            >
              {{ currentUser?.fullname[0].toUpperCase() }}
            </div>
            <div class="text-white flex flex-col">
              <h1 class="p-0 m-0 font-medium">{{ currentUser?.fullname }}</h1>
              <p class="p-0 m-0 font-medium text-x4">
                {{ currentUser?.roles }}
              </p>
            </div>
          </a>
          <mat-menu #menu="matMenu">
            <button [routerLink]="['account']" mat-menu-item>
              <mat-icon>account_circle</mat-icon>
              <span>View Profile</span>
            </button>
            <button mat-menu-item (click)="logout()">
              <mat-icon> logout </mat-icon>
              <span>Logout</span>
            </button>
          </mat-menu>
          @if (currentUser?.roles.includes("Admin")) {}
          <a routerLink="/users">
            <mat-icon class="mat-18">groups</mat-icon>
          </a>
        </div>
      </div>
    } @else {
      <div>
        <div class="flex gap5 item-center">
          <a mat-button routerLink="/login"> Login </a>
          <a mat-button routerLink="/register"> Register </a>
        </div>
      </div>
    }
  </mat-toolbar>
</div>
